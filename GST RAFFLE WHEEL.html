<title>GGE Raffle Draw</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1628;
    --gold: #B8935E;
    --gold-light: #D9BC8A;
    --gold-dim: #6B5636;
    --cream: #F7F4EE;
    --white: #FFFFFF;
    --muted: #8891A0;
    --border: #E4E0D6;
    --bg: #EFECE4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid rgba(184,147,94,0.25);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo img { width: 40px; height: 40px; object-fit: contain; }
  .logo-text { font-family: 'Cormorant Garamond', serif; color: var(--gold); font-size: 17px; font-weight: 600; }
  .logo-sub { font-size: 9.5px; color: var(--muted); font-weight: 500; letter-spacing: 1.8px; text-transform: uppercase; margin-top: 1px; }
  .refresh-btn {
    background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
    padding: 8px 16px; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 12px;
    font-weight: 500; cursor: pointer; transition: all .2s;
  }
  .refresh-btn:hover { background: rgba(184,147,94,0.12); }

  /* ── MAIN LAYOUT ── */
  #app { display: block; }
  .page {
    max-width: 1200px; margin: 0 auto; padding: 32px 20px 60px;
    display: grid; grid-template-columns: 1fr 340px; gap: 32px;
  }
  @media (max-width: 900px) {
    .page { grid-template-columns: 1fr; }
  }

  /* ── WHEEL AREA ── */
  .wheel-section { display: flex; flex-direction: column; align-items: center; }
  .wheel-wrap {
    position: relative;
    width: min(480px, 90vw);
    height: min(480px, 90vw);
    margin: 10px auto 24px;
  }
  #wheelCanvas {
    width: 100%; height: 100%;
    border-radius: 50%;
    box-shadow: 0 12px 50px rgba(10,22,40,0.35), 0 0 0 8px var(--navy), 0 0 0 11px var(--gold);
  }
  .pointer {
    position: absolute;
    top: -18px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 30px solid var(--gold);
    z-index: 10;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
  }
  .hub {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 64px; height: 64px;
    background: var(--navy);
    border: 3px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .hub img { width: 34px; height: 34px; object-fit: contain; }

  .spin-btn {
    padding: 16px 56px;
    background: linear-gradient(135deg, #1B4F8C, #0A1628);
    color: #FFFFFF;
    border: 2px solid var(--gold);
    border-radius: 40px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 8px 24px rgba(27,79,140,0.4);
  }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(27,79,140,0.5); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty-msg {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 20px;
  }

  /* ── WINNER BANNER ── */
  .winner-banner {
    display: none;
    margin-top: 22px;
    background: var(--navy);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 20px 32px;
    text-align: center;
    animation: winnerPop .4s ease;
  }
  .winner-banner.show { display: block; }
  @keyframes winnerPop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .winner-label { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
  .winner-name { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: #FFFFFF; font-weight: 700; margin-top: 6px; }
  .winner-unit { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; }

  /* ── CONFETTI ── */
  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 16px;
    z-index: 900;
    pointer-events: none;
    opacity: 0.95;
    animation-name: confettiFall;
    animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ── SIDEBAR ── */
  .sidebar-card {
    background: var(--white);
    border-radius: 14px;
    box-shadow: 0 2px 20px rgba(10,22,40,0.08);
    padding: 20px;
    margin-bottom: 20px;
  }
  .sidebar-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--muted); margin-bottom: 14px;
  }
  .entrant-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .entrant-row:last-child { border-bottom: none; }
  .entrant-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .entrant-name { flex: 1; color: var(--navy); font-weight: 500; }
  .entrant-tickets { color: var(--gold); font-weight: 700; font-size: 13px; }
  .total-row {
    display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px;
    border-top: 2px solid var(--navy); font-weight: 700; font-size: 13px;
  }

  .winners-log-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .winners-log-item:last-child { border-bottom: none; }
  .winners-log-name { font-weight: 600; color: var(--navy); }
  .winners-log-time { font-size: 10.5px; color: var(--muted); }
  .no-winners { color: var(--muted); font-size: 12.5px; text-align: center; padding: 10px 0; }
</style>
</head>

<script>
// ── CONFIG ──────────────────────────────────────────────
// Must match the same Web App URL used in the Advisor Tracker / Manager Dashboard.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3kBCO842j8u9MkOf8hc4U8NjxYltc7GGojd3nThq7Y2UUSCHZsYM3KYY4cHsWt58HbQ/exec";
// No PIN/email gate here — access is controlled entirely by the Manager
// Dashboard's own Admin PIN, which is the only thing that can open this
// page (it's embedded and never linked publicly).

const COLOR_PALETTE = [
  '#C0392B', '#E67E22', '#F1C40F', '#27AE60', '#16A085',
  '#2980B9', '#8E44AD', '#D35400', '#2ECC71', '#3498DB',
  '#9B59B6', '#E74C3C', '#1ABC9C', '#F39C12', '#34495E', '#7F8C8D'
];

let entrants = [];      // [{ name, unit, tickets, color, startAngle, endAngle }]
let currentRotation = 0;
let spinning = false;

// Load ticket data the moment the page opens — no gate to click through first.
document.addEventListener('DOMContentLoaded', loadEntrants);

// ── DATA LOADING ─────────────────────────────────────────
async function loadEntrants() {
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  btn.textContent = 'Loading...';
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getAllRaffle`);
    const data = await res.json();
    const raw = data.entries || [];

    // Sum net tickets per advisor across every submission they've ever made.
    const totals = {}; // name -> { tickets, unit }
    raw.forEach(e => {
      const name = e.advisor?.name;
      if (!name) return;
      if (!totals[name]) totals[name] = { tickets: 0, unit: e.advisor?.team || '' };
      totals[name].tickets += Number(e.entriesSubmitted) || 0;
      if (e.advisor?.team) totals[name].unit = e.advisor.team;
    });

    // Exclude anyone at net zero — only real ticket-holders go on the wheel.
    const names = Object.keys(totals).filter(n => totals[n].tickets > 0);
    names.sort((a, b) => totals[b].tickets - totals[a].tickets);

    const totalTickets = names.reduce((sum, n) => sum + totals[n].tickets, 0);
    let angleCursor = 0;
    entrants = names.map((name, i) => {
      const tickets = totals[name].tickets;
      const sweep = (tickets / totalTickets) * 360;
      const entry = {
        name,
        unit: totals[name].unit,
        tickets,
        color: COLOR_PALETTE[i % COLOR_PALETTE.length],
        startAngle: angleCursor,
        endAngle: angleCursor + sweep,
      };
      angleCursor += sweep;
      return entry;
    });

    renderEntrantsList(totalTickets);
    drawWheel();

    const empty = entrants.length === 0;
    document.getElementById('emptyMsg').style.display = empty ? 'block' : 'none';
    document.getElementById('wheelCanvas').style.display = empty ? 'none' : 'block';
    btn.disabled = empty;
    btn.textContent = 'Spin the Wheel';
  } catch (err) {
    console.error('Could not load raffle entries:', err);
    btn.textContent = 'Spin the Wheel';
  }
}

function renderEntrantsList(totalTickets) {
  const list = document.getElementById('entrantsList');
  if (!entrants.length) {
    list.innerHTML = '<div class="no-winners">No advisors with raffle tickets yet.</div>';
    document.getElementById('totalTickets').textContent = '0';
    return;
  }
  list.innerHTML = entrants.map(e => `
    <div class="entrant-row">
      <div class="entrant-swatch" style="background:${e.color};"></div>
      <div class="entrant-name">${e.name}</div>
      <div class="entrant-tickets">${e.tickets}</div>
    </div>
  `).join('');
  document.getElementById('totalTickets').textContent = totalTickets;
}

// ── WHEEL DRAWING ─────────────────────────────────────────
function drawWheel() {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const cx = size / 2, cy = size / 2, r = size / 2 - 6;

  ctx.clearRect(0, 0, size, size);

  if (!entrants.length) return;

  entrants.forEach(e => {
    // Drawing convention: 0deg = top (12 o'clock), sweeping clockwise —
    // matches the fixed pointer position and the rotation math in spinWheel().
    const startRad = (e.startAngle - 90) * Math.PI / 180;
    const endRad = (e.endAngle - 90) * Math.PI / 180;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startRad, endRad);
    ctx.closePath();
    ctx.fillStyle = e.color;
    ctx.fill();
    ctx.strokeStyle = '#0A1628';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label at the center of this advisor's arc.
    const midAngle = (e.startAngle + e.endAngle) / 2;
    const midRad = (midAngle - 90) * Math.PI / 180;
    ctx.save();
    ctx.translate(cx + Math.cos(midRad) * r * 0.62, cy + Math.sin(midRad) * r * 0.62);
    ctx.rotate(midRad + Math.PI / 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '600 20px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    const label = e.name.length > 16 ? e.name.split(' ')[0] : e.name;
    ctx.fillText(label, 0, 0);
    ctx.restore();
  });
}

// ── SPIN LOGIC ────────────────────────────────────────────
// ── SOUND EFFECTS (Web Audio API — no external audio files needed) ──
const audioCtx = window.AudioContext ? new AudioContext() : null;

function playTick() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = 1000;
  gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function playWhoo() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  // Rising-then-falling pitch sweep reads as a celebratory "whoo!"
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(280, now);
  osc.frequency.exponentialRampToValueAtTime(720, now + 0.28);
  osc.frequency.exponentialRampToValueAtTime(520, now + 0.55);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.3, now + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.7);

  // A quick bright "ding" layered on top for extra sparkle.
  const bell = audioCtx.createOscillator();
  const bellGain = audioCtx.createGain();
  bell.type = 'triangle';
  bell.frequency.value = 1200;
  bellGain.gain.setValueAtTime(0.15, now + 0.1);
  bellGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  bell.connect(bellGain);
  bellGain.connect(audioCtx.destination);
  bell.start(now + 0.1);
  bell.stop(now + 0.5);
}

// ── CONFETTI ─────────────────────────────────────────────
const CONFETTI_COLORS = ['#B8935E', '#1B4F8C', '#C0392B', '#27AE60', '#F1C40F', '#8E44AD', '#FFFFFF'];

function launchConfetti() {
  const count = 90;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    piece.style.background = color;
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
    piece.style.animationDelay = (Math.random() * 0.4) + 's';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4500);
  }
}

// ── SPIN LOGIC ────────────────────────────────────────────
function spinWheel() {
  if (spinning || !entrants.length) return;
  spinning = true;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  document.getElementById('winnerBanner').classList.remove('show');
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  const totalTickets = entrants.reduce((s, e) => s + e.tickets, 0);
  const pick = Math.random() * totalTickets;
  let cumulative = 0;
  let winner = entrants[entrants.length - 1];
  for (const e of entrants) {
    cumulative += e.tickets;
    if (pick < cumulative) { winner = e; break; }
  }

  // Land somewhere random within the winner's arc, not always dead center.
  const targetAngle = winner.startAngle + Math.random() * (winner.endAngle - winner.startAngle);
  const spins = 6; // full extra rotations for visual flourish
  const startRotation = currentRotation;
  const finalRotation = startRotation + spins * 360 + ((360 - targetAngle) - (startRotation % 360) + 360) % 360;

  const duration = 5600; // ms
  const canvas = document.getElementById('wheelCanvas');
  const startTime = performance.now();
  let lastTickSegment = Math.floor(startRotation / segmentAngleForTick());

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function frame(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    const eased = easeOutCubic(t);
    const rotation = startRotation + (finalRotation - startRotation) * eased;
    canvas.style.transform = `rotate(${rotation}deg)`;

    // Fire a tick every time we cross a segment boundary, spaced by the
    // smallest slice on the wheel so ticks feel natural rather than random.
    const seg = segmentAngleForTick();
    const currentSegment = Math.floor(rotation / seg);
    if (currentSegment !== lastTickSegment) {
      playTick();
      lastTickSegment = currentSegment;
    }

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      currentRotation = finalRotation;
      spinning = false;
      document.getElementById('winnerName').textContent = winner.name;
      document.getElementById('winnerUnit').textContent = winner.unit ? `Unit: ${winner.unit}` : '';
      document.getElementById('winnerBanner').classList.add('show');
      playWhoo();
      launchConfetti();
      logWinner(winner);
      removeWinnerAndRebuild(winner);
    }
  }
  requestAnimationFrame(frame);
}

// Roughly one tick per smallest slice on the wheel — gives a satisfying,
// evenly-paced ticking sound as the wheel spins past each segment.
function segmentAngleForTick() {
  if (!entrants.length) return 30;
  const minSweep = Math.min(...entrants.map(e => e.endAngle - e.startAngle));
  return Math.max(minSweep, 6); // floor it so huge entrant counts don't tick too fast
}

// Takes the winner out of this session's pool so they can't be drawn again,
// then redistributes the remaining advisors' arcs proportionally and redraws.
function removeWinnerAndRebuild(winner) {
  entrants = entrants.filter(e => e.name !== winner.name);

  const totalTickets = entrants.reduce((s, e) => s + e.tickets, 0);
  let angleCursor = 0;
  entrants.forEach(e => {
    const sweep = totalTickets > 0 ? (e.tickets / totalTickets) * 360 : 0;
    e.startAngle = angleCursor;
    e.endAngle = angleCursor + sweep;
    angleCursor += sweep;
  });

  // Snap the wheel back to its base rotation instantly (no animation) so
  // the next spin starts clean.
  const canvas = document.getElementById('wheelCanvas');
  canvas.style.transform = 'rotate(0deg)';
  currentRotation = 0;

  renderEntrantsList(totalTickets);
  drawWheel();

  const btn = document.getElementById('spinBtn');
  const empty = entrants.length === 0;
  document.getElementById('emptyMsg').style.display = empty ? 'block' : 'none';
  document.getElementById('wheelCanvas').style.display = empty ? 'none' : 'block';
  btn.disabled = empty;
  if (empty) btn.textContent = 'No More Entrants';
}

function logWinner(winner) {
  const log = document.getElementById('winnersLog');
  if (log.querySelector('.no-winners')) log.innerHTML = '';
  const time = new Date().toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
  const item = document.createElement('div');
  item.className = 'winners-log-item';
  item.innerHTML = `<span class="winners-log-name">${winner.name}</span><span class="winners-log-time">${time}</span>`;
  log.prepend(item);
}
</script>
